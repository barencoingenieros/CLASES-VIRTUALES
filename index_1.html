<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso a la clase virtual</title>
<style>
  :root {
    --bg: #eef1f8;
    --card: #ffffff;
    --text: #1b2033;
    --muted: #5d6680;
    --line: #d5daea;
    --accent: #3b4fd8;
    --accent-dark: #2c3cb0;
    --accent-soft: #e7eaff;
    --error: #c0263a;
    --error-soft: #fdecee;
    --ok: #177a4b;
    --ok-soft: #e4f6ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131f;
      --card: #1a1f31;
      --text: #eceffa;
      --muted: #a2abc6;
      --line: #313953;
      --accent: #7c8cff;
      --accent-dark: #97a4ff;
      --accent-soft: #252c4a;
      --error: #ff8593;
      --error-soft: #3a1c24;
      --ok: #6bdba1;
      --ok-soft: #173326;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    line-height: 1.45;
  }
  main {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 26px 26px;
    box-shadow: 0 12px 34px rgba(20, 28, 70, .10);
  }
  .icon {
    width: 54px; height: 54px;
    border-radius: 15px;
    background: var(--accent-soft);
    color: var(--accent);
    display: grid; place-items: center;
    margin-bottom: 18px;
  }
  h1 { font-size: 1.42rem; margin: 0 0 6px; letter-spacing: -.01em; }
  p.lead { margin: 0 0 22px; color: var(--muted); font-size: .96rem; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 7px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 1.22rem;
    letter-spacing: .08em;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 11px;
    background: transparent;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  input::placeholder { color: var(--muted); opacity: .55; letter-spacing: .04em; }
  button, a.btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    font: inherit;
    font-weight: 650;
    font-size: 1.02rem;
    text-align: center;
    text-decoration: none;
    padding: 13px 16px;
    border: 0;
    border-radius: 11px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    transition: background .15s, opacity .15s;
  }
  @media (prefers-color-scheme: dark) { button, a.btn { color: #10131f; } }
  button:hover, a.btn:hover { background: var(--accent-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .msg {
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 10px;
    font-size: .93rem;
    background: var(--error-soft);
    color: var(--error);
  }
  .welcome {
    padding: 14px 15px;
    border-radius: 12px;
    background: var(--ok-soft);
    margin-bottom: 16px;
  }
  .welcome small { color: var(--ok); font-weight: 650; font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; }
  .welcome strong { display: block; font-size: 1.14rem; margin-top: 3px; }
  ul.courses { list-style: none; padding: 0; margin: 0 0 4px; }
  ul.courses li {
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: .95rem;
  }
  ul.courses li:last-child { border-bottom: 0; }
  .sub { color: var(--muted); font-size: .88rem; margin: 12px 0 0; text-align: center; }
  .linkbtn {
    background: none; color: var(--muted); font-weight: 500; font-size: .9rem;
    padding: 8px; margin-top: 8px; text-decoration: underline;
  }
  .linkbtn:hover { background: none; color: var(--text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="2.5"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg>
  </div>

  <section id="paso-cedula">
    <h1>Acceso a la clase virtual</h1>
    <p class="lead">Ingresa tu número de cédula para entrar a la reunión de Microsoft Teams.</p>
    <form id="form" novalidate>
      <label for="cedula">Número de cédula</label>
      <input id="cedula" name="cedula" type="text" inputmode="numeric" autocomplete="off"
             maxlength="13" placeholder="0000000000" autofocus required>
      <button id="btn" type="submit">Ingresar</button>
      <div id="msg" class="msg" role="alert" hidden></div>
    </form>
  </section>

  <section id="paso-ok" hidden>
    <div class="welcome">
      <small>Acceso verificado</small>
      <strong id="nombre"></strong>
    </div>
    <ul class="courses" id="cursos"></ul>
    <a class="btn" id="enlace" href="#" rel="noopener">Entrar a la clase</a>
    <p class="sub" id="cuenta"></p>
    <button type="button" class="linkbtn" id="otra">No soy yo, ingresar otra cédula</button>
  </section>
</main>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
let temporizador = null;

function normalizar(v) {
  let d = (v || "").replace(/\D/g, "");
  if (d.length === 9) d = "0" + d;   // cédula escrita sin el cero inicial
  return d;
}

async function buscar(cedula) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(cedula), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt: b64(SAL), iterations: ITER, hash: "SHA-256" }, base, 384));
  const registro = DATOS[hex(bits.slice(0, 16))];
  if (!registro) return null;
  const crudo = b64(registro);
  const clave = await crypto.subtle.importKey("raw", bits.slice(16, 48), "AES-GCM", false, ["decrypt"]);
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: crudo.slice(0, 12) }, clave, crudo.slice(12));
  return JSON.parse(new TextDecoder().decode(claro));
}

function error(texto) {
  $("msg").textContent = texto;
  $("msg").hidden = false;
}

function mostrar(est) {
  $("nombre").textContent = est.n;
  const ul = $("cursos");
  ul.textContent = "";
  est.c.forEach(c => { const li = document.createElement("li"); li.textContent = c; ul.appendChild(li); });
  $("enlace").href = est.u;
  $("paso-cedula").hidden = true;
  $("paso-ok").hidden = false;

  let s = 3;
  const tick = () => {
    if (s <= 0) { clearInterval(temporizador); $("cuenta").textContent = "Abriendo Microsoft Teams…"; window.location.href = est.u; return; }
    $("cuenta").textContent = "Serás redirigido en " + s + " s…";
    s--;
  };
  tick();
  temporizador = setInterval(tick, 1000);
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("msg").hidden = true;
  const cedula = normalizar($("cedula").value);
  if (cedula.length !== 10) { error("La cédula debe tener 10 dígitos."); return; }
  if (!window.crypto || !crypto.subtle) { error("Este navegador no es compatible. Abre el enlace en Chrome, Edge, Firefox o Safari actualizados."); return; }

  const btn = $("btn");
  btn.disabled = true; btn.textContent = "Verificando…";
  try {
    const est = await buscar(cedula);
    if (est) mostrar(est);
    else error("Esta cédula no consta en la lista de estudiantes. Revisa el número o comunícate con tu docente.");
  } catch (err) {
    error("No se pudo verificar la cédula. Intenta nuevamente.");
  } finally {
    btn.disabled = false; btn.textContent = "Ingresar";
  }
});

$("otra").addEventListener("click", () => {
  clearInterval(temporizador);
  $("paso-ok").hidden = true;
  $("paso-cedula").hidden = false;
  $("cedula").value = "";
  $("cedula").focus();
});
</script>
